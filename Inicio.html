<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FitLife - Bienestar físico y emocional</title>
</head>

<body style="margin: 0; background-color: #0D2B45; font-family: Arial, sans-serif;">

<!-- Encabezado principal -->
<div style="
    text-align: center;
    padding-top: 40px;
    padding-bottom: 30px;
">

    <div style="
        display: inline-block;
        background-color: white;
        padding: 22px 55px 20px 55px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        border: 1px solid rgba(0,143,90,0.15);
    ">

        <h1 style="
    color: #008F5A;
    font-size: 64px;
    letter-spacing: 5px;
    margin: 0;
    font-weight: 900;
    font-family: Arial Black, Impact, sans-serif;
    text-transform: uppercase;
    font-style: italic;
    transform: skewX(-8deg);
    text-shadow:
        2px 2px 0px #ffffff,
        4px 4px 0px rgba(0,0,0,0.15);
">
            FITLIFE
        </h1>

        <div style="
            width: 70px;
            height: 4px;
            background-color: #008F5A;
            border-radius: 10px;
            margin: 10px auto 12px auto;
        "></div>

        <p style="
            color: #000000;
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 900;
    font-family: Arial Black, Impact, Arial, sans-serif;
    text-transform: uppercase;
    font-style: italic;
    transform: skewX(-5deg);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.10);
">
            Bienestar físico y emocional
        </p>

    </div>


    <p style="
        color: #FFFFFF;;
        font-size: 17px;
        margin: 22px 0 0 0;
    ">
        Tu bienestar comienza aquí
    </p>

</div>


<!-- Collage dinámico de imágenes -->
<div style="
    width: 100%;
    height: 500px;
    margin: 10px 0 0 0;
    display: flex;
    overflow: hidden;
    position: relative;
    box-shadow: 0 12px 35px rgba(0,0,0,0.22);
">

    <!-- Imagen izquierda -->
    <div style="
        width: 38%;
        height: 100%;
        position: relative;
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
    ">

        <img
                src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1400&q=90"
                alt="Actividad física"
                style="
                width: 115%;
                height: 100%;
                object-fit: cover;
                display: block;
            "
        >

        <div style="
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            padding: 80px 30px 30px 30px;
            box-sizing: border-box;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            color: white;
            font-size: 27px;
            font-weight: bold;
        ">
            Actividad física
        </div>

    </div>


    <!-- Imagen central -->
    <div style="
        width: 38%;
        height: 100%;
        position: relative;
        overflow: hidden;
        margin-left: -5%;
        clip-path: polygon(12% 0, 100% 0, 88% 100%, 0 100%);
    ">

        <img
                src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1400&q=90"
                alt="Bienestar mental"
                style="
                width: 115%;
                height: 100%;
                object-fit: cover;
                display: block;
            "
        >

        <div style="
            position: absolute;
            left: 5%;
            bottom: 0;
            width: 95%;
            padding: 80px 30px 30px 30px;
            box-sizing: border-box;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            color: white;
            font-size: 27px;
            font-weight: bold;
        ">
            Bienestar mental
        </div>

    </div>


    <!-- Imagen derecha -->
    <div style="
        width: 38%;
        height: 100%;
        position: relative;
        overflow: hidden;
        margin-left: -5%;
        clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
    ">

        <img
                src="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1400&q=90"
                alt="Alimentación saludable"
                style="
                width: 115%;
                height: 100%;
                object-fit: cover;
                display: block;
            "
        >

        <div style="
            position: absolute;
            left: 5%;
            bottom: 0;
            width: 95%;
            padding: 80px 30px 30px 30px;
            box-sizing: border-box;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            color: white;
            font-size: 27px;
            font-weight: bold;
        ">
            Alimentación saludable
        </div>

    </div>

</div>

<!-- Texto inferior -->
<div style="text-align: center; margin-top: 30px;">

    <p style="
            color: #FFFFFF;;
            font-size: 17px;
            margin-bottom: 20px;
        ">
        Empieza a construir una vida más saludable.
    </p>


    <!-- Botones -->
    <a href="registro.html"
       style="
               display: inline-block;
               background-color: #008F5A;
               color: white;
               text-decoration: none;
               padding: 13px 28px;
               border-radius: 8px;
               font-size: 15px;
               font-weight: bold;
               margin-right: 10px;
           ">
        Crear cuenta
    </a>

    <a href="login.html"
       style="
               display: inline-block;
               background-color: #455A64;
               color: white;
               text-decoration: none;
               padding: 13px 28px;
               border-radius: 8px;
               font-size: 15px;
               font-weight: bold;
               margin-left: 10px;
           ">
        Iniciar sesión
    </a>

</div>


<!-- Pie de página -->
<footer style="
        text-align: center;
        margin-top: 45px;
        padding: 20px;
        background-color: #f4f6f8;
        border-top: 1px solid #ddd;
    ">

    <p style="
            color: #455A64;
            font-size: 14px;
            margin: 0;
        ">
        © 2026 FitLife - Bienestar físico y emocional
    </p>

</footer>

</body>
</html>
