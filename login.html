<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>FitLife - Iniciar sesión</title>
</head>

<body style="
    margin: 0;
    background-color: #0D2B45;
    font-family: Arial, sans-serif;
    min-height: 100vh;
">

<!-- Encabezado -->
<div style="
        text-align: center;
        padding-top: 40px;
        padding-bottom: 25px;
    ">

  <!-- Cuadro blanco de FITLIFE -->
  <div style="
            display: inline-block;
            background-color: #FFFFFF;
            padding: 22px 55px 20px 55px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            border: 1px solid rgba(0,143,90,0.15);
        ">

    <h1 style="
                color: #008F5A;
                font-size: 64px;
                letter-spacing: 5px;
                margin: 0;
                font-weight: 900;
                font-family: Arial Black, Impact, sans-serif;
                text-transform: uppercase;
                font-style: italic;
                transform: skewX(-8deg);
                text-shadow:
                    2px 2px 0px #ffffff,
                    4px 4px 0px rgba(0,0,0,0.15);
            ">
      FITLIFE
    </h1>

    <div style="
                width: 70px;
                height: 4px;
                background-color: #008F5A;
                border-radius: 10px;
                margin: 10px auto 12px auto;
            "></div>

    <p style="
                color: #000000;
                font-size: 20px;
                letter-spacing: 2px;
                margin: 0;
                font-weight: 900;
                font-family: Arial Black, Impact, Arial, sans-serif;
                text-transform: uppercase;
                font-style: italic;
                transform: skewX(-5deg);
                text-shadow: 1px 1px 0px rgba(0,0,0,0.10);
            ">
      Bienestar físico y emocional
    </p>

  </div>

</div>


<!-- Cuadro de inicio de sesión -->
<div style="
        width: 90%;
        max-width: 500px;
        margin: 10px auto 40px auto;
        background-color: #FFFFFF;
        border-radius: 20px;
        padding: 35px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    ">

  <p style="
            text-align: center;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        ">
    Ingresa tus datos para acceder a tu cuenta en FitLife.
  </p>


  <!-- Correo electrónico -->
  <div style="
            margin-bottom: 20px;
        ">

    <label style="
                display: block;
                color: #0D2B45;
                font-weight: bold;
                margin-bottom: 6px;
            ">
      Correo electrónico
    </label>

    <input
            type="email"
            placeholder="ejemplo@correo.com"
            style="
                    width: 100%;
                    padding: 12px;
                    box-sizing: border-box;
                    border: 1px solid #CBD5DA;
                    border-radius: 8px;
                    font-size: 14px;
                "
    >

  </div>


  <!-- Contraseña -->
  <div style="
            margin-bottom: 25px;
        ">

    <label style="
                display: block;
                color: #0D2B45;
                font-weight: bold;
                margin-bottom: 6px;
            ">
      Contraseña
    </label>

    <input
            type="password"
            placeholder="Escribe tu contraseña"
            style="
                    width: 100%;
                    padding: 12px;
                    box-sizing: border-box;
                    border: 1px solid #CBD5DA;
                    border-radius: 8px;
                    font-size: 14px;
                "
    >

  </div>


  <!-- Botones -->
  <div style="
            text-align: center;
            margin-top: 30px;
        ">

    <a
            href="index.html"
            style="
                    display: inline-block;
                    background-color: #008F5A;
                    color: white;
                    text-decoration: none;
                    padding: 14px 35px;
                    border-radius: 9px;
                    font-size: 16px;
                    font-weight: bold;
                    margin-right: 10px;
                "
    >
      Iniciar sesión
    </a>

    <a
            href="index.html"
            style="
                    display: inline-block;
                    background-color: #0D2B45;
                    color: white;
                    text-decoration: none;
                    padding: 14px 35px;
                    border-radius: 9px;
                    font-size: 16px;
                    font-weight: bold;
                    margin-left: 10px;
                "
    >
      Volver
    </a>

  </div>

</div>


<!-- Pie de página -->
<footer style="
        text-align: center;
        padding: 20px;
        background-color: #FFFFFF;
        border-top: 1px solid #ddd;
    ">

  <p style="
            color: #455A64;
            font-size: 14px;
            margin: 0;
        ">
    © 2026 FitLife - Bienestar físico y emocional
  </p>

</footer>

</body>
</html>
