<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>FitLife - Crear cuenta</title>
</head>

<body style="
    margin: 0;
    background-color: #0D2B45;
    font-family: Arial, sans-serif;
    min-height: 100vh;
">

<!-- Encabezado -->
<div style="
    text-align: center;
    padding-top: 40px;
    padding-bottom: 25px;
">

    <!-- Cuadro blanco de FITLIFE -->
    <div style="
        display: inline-block;
        background-color: #FFFFFF;
        padding: 22px 55px 20px 55px;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        border: 1px solid rgba(0,143,90,0.15);
    ">

        <h1 style="
            color: #008F5A;
            font-size: 64px;
            letter-spacing: 5px;
            margin: 0;
            font-weight: 900;
            font-family: Arial Black, Impact, sans-serif;
            text-transform: uppercase;
            font-style: italic;
            transform: skewX(-8deg);
            text-shadow:
                2px 2px 0px #ffffff,
                4px 4px 0px rgba(0,0,0,0.15);
        ">
            FITLIFE
        </h1>

        <div style="
            width: 70px;
            height: 4px;
            background-color: #008F5A;
            border-radius: 10px;
            margin: 10px auto 12px auto;
        "></div>

        <p style="
            color: #000000;
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0;
    font-weight: 900;
    font-family: Arial Black, Impact, Arial, sans-serif;
    text-transform: uppercase;
    font-style: italic;
    transform: skewX(-5deg);
    text-shadow: 1px 1px 0px rgba(0,0,0,0.10);
">
            Bienestar físico y emocional
        </p>

    </div>



</div>


<!-- Formulario -->
<div style="
        width: 90%;
        max-width: 850px;
        margin: 10px auto 40px auto;
        background-color: #FFFFFF;
        border-radius: 20px;
        padding: 35px;
        box-sizing: border-box;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        text-align: center;
    ">



    <p style="
            text-align: center;
    color: #000000;
    font-weight: bold;
    margin-bottom: 30px;
">
        Completa tus datos para personalizar tu experiencia en FITLIFE
    </p>


    <!-- Datos personales -->
    <h3 style="
            color: #008F5A;
            border-bottom: 2px solid #008F5A;
            padding-bottom: 8px;
        ">
        Datos personales
    </h3>


    <div style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        ">

        <!-- Nombre -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Nombre completo
            </label>

            <input
                    type="text"
                    placeholder="Escribe tu nombre"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>


        <!-- Correo -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Correo electrónico
            </label>

            <input
            <input
                    id="correoRegistro"
                    type="email"
                    placeholder="ejemplo@correo.com"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>


        <!-- Contraseña -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Contraseña
            </label>

            <input
                    id="contrasenaRegistro"
                    type="password"
                    placeholder="Crea una contraseña"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>


        <!-- Edad -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Edad
            </label>

            <input
                    type="number"
                    placeholder="Ejemplo: 25"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>


        <!-- Género -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Género
            </label>

            <select style="
                    width: 100%;
                    padding: 12px;
                    box-sizing: border-box;
                    border: 1px solid #CBD5DA;
                    border-radius: 8px;
                    font-size: 14px;
                    background-color: white;
                ">
                <option>Selecciona una opción</option>
                <option>Femenino</option>
                <option>Masculino</option>
                <option>Otro</option>
                <option>Prefiero no decirlo</option>
            </select>
        </div>


        <!-- Región -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Región
            </label>

            <input
                    type="text"
                    placeholder="Ciudad o región"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>

    </div>


    <!-- Información física -->
    <h3 style="
            color: #008F5A;
            border-bottom: 2px solid #008F5A;
            padding-bottom: 8px;
            margin-top: 35px;
        ">
        Información física
    </h3>


    <div style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        ">

        <!-- Peso -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Peso (kg)
            </label>

            <input
                    type="number"
                    placeholder="Ejemplo: 70"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>


        <!-- Altura -->
        <div>
            <label style="
                    display: block;
                    color: #0D2B45;
                    font-weight: bold;
                    margin-bottom: 6px;
                ">
                Altura (cm)
            </label>

            <input
                    type="number"
                    placeholder="Ejemplo: 170"
                    style="
                        width: 100%;
                        padding: 12px;
                        box-sizing: border-box;
                        border: 1px solid #CBD5DA;
                        border-radius: 8px;
                        font-size: 14px;
                    "
            >
        </div>

    </div>


    <!-- Objetivo -->
    <h3 style="
            color: #008F5A;
            border-bottom: 2px solid #008F5A;
            padding-bottom: 8px;
            margin-top: 35px;
        ">
        Objetivo personal
    </h3>


    <select style="
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #CBD5DA;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        ">

        <option>Selecciona tu objetivo</option>
        <option>Perder peso</option>
        <option>Ganar masa muscular</option>
        <option>Mejorar mi condición física</option>
        <option>Mantener un estilo de vida saludable</option>
        <option>Mejorar mi bienestar emocional</option>

    </select>


    <!-- Condiciones especiales -->
    <h3 style="
            color: #008F5A;
            border-bottom: 2px solid #008F5A;
            padding-bottom: 8px;
            margin-top: 35px;
        ">
        Condiciones especiales
    </h3>


    <textarea
            placeholder="Indica si tienes alguna condición especial que debamos tener en cuenta..."
            style="
                width: 100%;
                height: 90px;
                padding: 12px;
                box-sizing: border-box;
                border: 1px solid #CBD5DA;
                border-radius: 8px;
                font-size: 14px;
                resize: vertical;
            "
    ></textarea>


    <!-- Botones -->
    <div style="
        text-align: center;
        margin-top: 35px;
    ">

        <a
                href="#"
                onclick="registrarUsuario(); return false;"
                style="
        display: inline-block;
        background-color: #008F5A;
        color: white;
        text-decoration: none;
        padding: 14px 35px;
        border-radius: 9px;
        font-size: 16px;
        font-weight: bold;
        margin-right: 10px;
    "
        >
            Crear cuenta
        </a>

        <a
                href="Inicio.html"
                style="
                display: inline-block;
                background-color: #0D2B45;
                color: white;
                text-decoration: none;
                padding: 14px 35px;
                border-radius: 9px;
                font-size: 16px;
                font-weight: bold;
                margin-left: 10px;
            "
        >
            Volver
        </a>

    </div>

    </div>

</div>


<!-- Pie de página -->
<footer style="
        text-align: center;
        padding: 20px;
        background-color: #FFFFFF;
        border-top: 1px solid #ddd;
    ">

    <p style="
            color: #455A64;
            font-size: 14px;
            margin: 0;
        ">
        © 2026 FitLife - Bienestar físico y emocional
    </p>

</footer>
<script>
    function registrarUsuario() {
        const correo = document.getElementById("correoRegistro").value.trim();
        const contrasena = document.getElementById("contrasenaRegistro").value.trim();

        if (correo === "" || contrasena === "") {
            alert("Por favor, completa el correo electrónico y la contraseña.");
            return;
        }

        localStorage.setItem("fitlifeCorreo", correo);
        localStorage.setItem("fitlifeContrasena", contrasena);

        window.location.href = "login.html";
    }
</script>

</body>
</html>
</body>
</html>
